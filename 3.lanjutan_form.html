<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Purnama Anaking">
    <meta name="keyword" content="Belajar HTML, Belajar Web">
    <meta name="description" content="Praktikum Modul 1 - Form HTML">
    <meta name="robots" content="index, follow">
    <title>Form Registrasi</title>

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 20px;
        }

        fieldset {
            width: 460px;
            margin-bottom: 12px;
        }

        td {
            padding: 2px 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"] {
            width: 170px;
            box-sizing: border-box;
        }

        textarea {
            width: 240px;
        }
    </style>
</head>

<body>

    <h1>Form Registrasi</h1>

    <form action="" method="get">

        <!-- BIODATA -->
        <fieldset>
            <legend>Biodata</legend>

            <table>
                <tr>
                    <td>Nama Mahasiswa</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="nama_mahasiswa"
                               placeholder="Nama Anda">
                    </td>
                </tr>

                <tr>
                    <td>No Induk Mahasiswa (NIM)</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="nim"
                               placeholder="123456789">
                    </td>
                </tr>

                <tr>
                    <td>Alamat Mahasiswa</td>
                    <td>:</td>
                    <td>
                        <textarea name="alamat" cols="30" rows="5"
                                  placeholder="Alamat Anda"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tanggal">
                            <option>01</option>
                            <option>02</option>
                            <option>03</option>
                            <option>04</option>
                            <option>05</option>
                            <option>06</option>
                            <option>07</option>
                            <option>08</option>
                            <option>09</option>
                            <option>10</option>
                            <option>11</option>
                            <option>12</option>
                            <option>13</option>
                            <option>14</option>
                            <option>15</option>
                            <option>16</option>
                            <option>17</option>
                            <option>18</option>
                            <option>19</option>
                            <option>20</option>
                            <option>21</option>
                            <option>22</option>
                            <option>23</option>
                            <option>24</option>
                            <option>25</option>
                            <option>26</option>
                            <option>27</option>
                            <option>28</option>
                            <option>29</option>
                            <option>30</option>
                            <option>31</option>
                        </select>

                        <select name="bulan">
                            <option>Januari</option>
                            <option>Februari</option>
                            <option>Maret</option>
                            <option>April</option>
                            <option>Mei</option>
                            <option>Juni</option>
                            <option>Juli</option>
                            <option>Agustus</option>
                            <option>September</option>
                            <option>Oktober</option>
                            <option>November</option>
                            <option>Desember</option>
                        </select>

                        <select name="tahun">
                            <option>1990</option>
                            <option>1991</option>
                            <option>1992</option>
                            <option>1993</option>
                            <option>1994</option>
                            <option>1995</option>
                            <option>1996</option>
                            <option>1997</option>
                            <option>1998</option>
                            <option>1999</option>
                            <option>2000</option>
                            <option>2001</option>
                            <option>2002</option>
                            <option>2003</option>
                            <option>2004</option>
                            <option>2005</option>
                            <option>2006</option>
                            <option>2007</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="jenis_kelamin"
                               value="Pria" id="pria" checked>
                        <label for="pria">Pria</label>

                        <input type="radio" name="jenis_kelamin"
                               value="Wanita" id="wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>

                <tr>
                    <td>Upload Foto</td>
                    <td>:</td>
                    <td>
                        <input type="file" name="foto">
                    </td>
                </tr>

                <tr>
                    <td>URL Website</td>
                    <td>:</td>
                    <td>
                        <input type="url" name="website"
                               placeholder="URL Website Anda">
                    </td>
                </tr>

                <tr>
                    <td>Perguruan Tinggi</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="perguruan_tinggi">
                    </td>
                </tr>
            </table>
        </fieldset>

        <!-- INFO AKUN -->
        <fieldset>
            <legend>Info Akun</legend>

            <table>
                <tr>
                    <td>Email</td>
                    <td>:</td>
                    <td>
                        <input type="email" name="email"
                               placeholder="Email Anda">
                    </td>
                </tr>

                <tr>
                    <td>Username</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="username"
                               placeholder="Username Anda">
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td>
                        <input type="password" name="password"
                               placeholder="Password Anda">
                    </td>
                </tr>

                <tr>
                    <td>Ulangi Password</td>
                    <td>:</td>
                    <td>
                        <input type="password" name="ulang_password"
                               placeholder="Password Anda">
                    </td>
                </tr>
            </table>
        </fieldset>

        <!-- KEMAMPUAN DASAR -->
        <fieldset>
            <legend>Kemampuan Dasar</legend>

            <input type="checkbox" name="kemampuan[]" value="HTML"
                   id="html">
            <label for="html">HTML</label>

            <input type="checkbox" name="kemampuan[]" value="CSS"
                   id="css">
            <label for="css">CSS</label>

            <input type="checkbox" name="kemampuan[]" value="Javascript"
                   id="javascript">
            <label for="javascript">Javascript</label>

            <input type="checkbox" name="kemampuan[]" value="PHP"
                   id="php">
            <label for="php">PHP</label>

            <input type="checkbox" name="kemampuan[]" value="MySQL"
                   id="mysql">
            <label for="mysql">MySQL</label>

            <input type="checkbox" name="kemampuan[]" value="Laravel"
                   id="laravel">
            <label for="laravel">Laravel</label>

            <input type="checkbox" name="kemampuan[]" value="React Native"
                   id="react-native">
            <label for="react-native">React Native</label>
        </fieldset>

        <!-- BUTTON -->
        <input type="reset" value="Reset">
        <input type="submit" value="Simpan">
        <input type="button" value="Button" onclick="">

    </form>

</body>
</html>
